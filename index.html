<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ================================================================ renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const BG = 0xf3f3f5;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

// Studio environment: bright dome + softboxes, baked to a PMREM for reflections.
function studioEnv() {
  const s = new THREE.Scene();
  const g = new THREE.SphereGeometry(40, 48, 24);
  const col = [];
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 40;
    const v = h > 0 ? 0.42 + 0.4 * Math.pow(h, 0.6) : 0.42 - 0.25 * Math.pow(-h, 0.5);
    col.push(v, v, v * 1.015);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (w, h, pos, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(k), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0.6, 0); s.add(m);
  };
  panel(11, 5, V3(0, 9, 0), 3.4);          // overhead softbox
  panel(12, 1.6, V3(0, 3.2, -9), 2.0);     // long side strips
  panel(12, 1.6, V3(0, 3.2, 9), 2.0);
  panel(5, 3, V3(10, 3.5, 0), 1.6);        // front / rear fills
  panel(5, 3, V3(-10, 3.5, 0), 1.4);
  panel(14, 0.5, V3(0, 0.9, -9), 0.08);    // dark horizon band gives the paint some contrast
  panel(14, 0.5, V3(0, 0.9, 9), 0.08);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.02).texture;
  pm.dispose();
  return tex;
}
scene.environment = studioEnv();

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.9, 2.0, -5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
if (Q.has('cam')) { const [x, y, z] = Q.get('cam').split(',').map(Number); camera.position.set(x, y, z); }
if (Q.has('tgt')) { const [x, y, z] = Q.get('tgt').split(',').map(Number); controls.target.set(x, y, z); }

const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(2.5, 9, -2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3.4, right: 3.4, top: 3.4, bottom: -3.4, near: 1, far: 20 });
sun.shadow.radius = 7;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// ================================================================ helpers
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// smooth y(x) lookup through control points
function profile(points) {
  const curve = new THREE.SplineCurve(points.map(([x, y]) => new THREE.Vector2(x, y)));
  const pts = curve.getPoints(1500).sort((a, b) => a.x - b.x);
  return (x) => {
    if (x <= pts[0].x) return pts[0].y;
    if (x >= pts[pts.length - 1].x) return pts[pts.length - 1].y;
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; (pts[m].x < x ? (lo = m) : (hi = m)); }
    const t = (x - pts[lo].x) / (pts[hi].x - pts[lo].x || 1);
    return pts[lo].y + (pts[hi].y - pts[lo].y) * t;
  };
}

// resample a 2D polyline to n segments of equal arc length
function resample(pts, n) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = L[L.length - 1], out = [];
  let k = 0;
  for (let j = 0; j <= n; j++) {
    const s = (total * j) / n;
    while (k < pts.length - 2 && L[k + 1] < s) k++;
    const t = clamp((s - L[k]) / (L[k + 1] - L[k] || 1), 0, 1);
    out.push([lerp(pts[k][0], pts[k + 1][0], t), lerp(pts[k][1], pts[k + 1][1], t)]);
  }
  return out;
}

// per-vertex normals of a point grid by central differences, oriented away from `ref`
function gridNormals(P, ref) {
  const a = V3(), b = V3(), d = V3();
  return P.map((row, i) => row.map((p, j) => {
    a.subVectors(P[Math.min(i + 1, P.length - 1)][j], P[Math.max(i - 1, 0)][j]);
    b.subVectors(row[Math.min(j + 1, row.length - 1)], row[Math.max(j - 1, 0)]);
    const n = V3().crossVectors(a, b);
    d.subVectors(p, ref);
    if (n.lengthSq() < 1e-16) n.copy(d);
    n.normalize();
    if (n.dot(d) < 0) n.negate();
    return n;
  }));
}

// grid -> indexed geometry. cols = [{j, band}] lets a column be duplicated for a UV seam.
function gridGeo(P, N, cols, uvFn, i0 = 0, i1 = P.length - 1) {
  const pos = [], nor = [], uv = [], idx = [];
  const C = cols.length;
  for (let i = i0; i <= i1; i++)
    for (const c of cols) {
      const p = P[i][c.j], n = N[i][c.j];
      pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); uv.push(...uvFn(p, c, i));
    }
  const fa = V3(), fb = V3(), fn = V3(), vn = V3();
  const tri = (a, b, c) => {
    fa.set(pos[b * 3] - pos[a * 3], pos[b * 3 + 1] - pos[a * 3 + 1], pos[b * 3 + 2] - pos[a * 3 + 2]);
    fb.set(pos[c * 3] - pos[a * 3], pos[c * 3 + 1] - pos[a * 3 + 1], pos[c * 3 + 2] - pos[a * 3 + 2]);
    fn.crossVectors(fa, fb);
    if (fn.lengthSq() < 1e-18) return;
    vn.set(nor[a * 3] + nor[b * 3] + nor[c * 3], nor[a * 3 + 1] + nor[b * 3 + 1] + nor[c * 3 + 1], nor[a * 3 + 2] + nor[b * 3 + 2] + nor[c * 3 + 2]);
    fn.dot(vn) >= 0 ? idx.push(a, b, c) : idx.push(a, c, b);
  };
  for (let i = 0; i < i1 - i0; i++)
    for (let k = 0; k < C - 1; k++) {
      if (cols[k].j === cols[k + 1].j) continue;
      const a = i * C + k, b = (i + 1) * C + k, c = b + 1, d = a + 1;
      tri(a, b, d); tri(b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

// extrude a closed (z,y) polygon along X; mod(x, z, y) -> [z, y] can reshape it per station
function sweepX(poly, x0, x1, n, mod = (x, z, y) => [z, y]) {
  const pos = [];
  const ring = (x) => poly.map(([z, y]) => { const [zz, yy] = mod(x, z, y); return [x, yy, zz]; });
  let prev = ring(x0);
  const cap = (r) => { for (let k = 1; k < r.length - 1; k++) pos.push(...r[0], ...r[k], ...r[k + 1]); };
  cap(prev);
  for (let i = 1; i <= n; i++) {
    const cur = ring(lerp(x0, x1, i / n));
    for (let k = 0; k < poly.length; k++) {
      const k2 = (k + 1) % poly.length;
      pos.push(...prev[k], ...cur[k], ...prev[k2], ...cur[k], ...cur[k2], ...prev[k2]);
    }
    prev = cur;
  }
  cap(prev);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return toCreasedNormals(g, 0.7);
}

// superellipsoid (rounded box) from a sphere
function sEllipsoid(rx, ry, rz, n = 3.2, seg = 40) {
  const g = new THREE.SphereGeometry(1, seg, seg / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 / Math.pow(Math.abs(x) ** n + Math.abs(y) ** n + Math.abs(z) ** n, 1 / n);
    p.setXYZ(i, x * k * rx, y * k * ry, z * k * rz);
  }
  g.computeVertexNormals();
  return g;
}

function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// ---- analytic cut volumes (superellipsoids in car space) evaluated in the fragment shader.
// They punch real openings (wheel arches, lamps, intakes, cabin) into the lofted shells.
function vol({ c, ax = [1, 0, 0], up = [0, 1, 0], r, n = [2, 2, 2], mirror = true }) {
  const X = V3(...ax).normalize();
  const Z = V3().crossVectors(X, V3(...up)).normalize();
  const Y = V3().crossVectors(Z, X).normalize();
  return { c, X, Y, Z, r, n, mirror };
}
const f4 = (v) => v.toFixed(5);
const v3s = (a) => `vec3(${a.map(f4).join(',')})`;
function sdfGLSL(name, vols) {
  let s = `float ${name}(vec3 p){ float g = 1e3; vec3 q; vec3 l;\n`;
  for (const v of vols) {
    s += `q = p; ${v.mirror ? 'q.z = abs(q.z);' : ''} q -= ${v3s(v.c)};
      l = abs(vec3(dot(q,${v3s(v.X.toArray())}), dot(q,${v3s(v.Y.toArray())}), dot(q,${v3s(v.Z.toArray())})) / ${v3s(v.r)});
      g = min(g, pow(l.x,${f4(v.n[0])}) + pow(l.y,${f4(v.n[1])}) + pow(l.z,${f4(v.n[2])}) - 1.0);\n`;
  }
  return s + 'return g; }\n';
}
let shellId = 0;
function shell(mat, { cut = null, keep = null, offset = 0, backDark = false, frag = '' } = {}) {
  const id = 'shell' + shellId++;
  if (backDark) mat.side = THREE.DoubleSide;
  if (!mat.transparent && (cut || keep)) mat.alphaToCoverage = true;
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>\nvObj = position;\ntransformed += normalize(objectNormal) * ${f4(offset)};`);
    let code = '';
    if (cut) code += 'float cg = cutG(vObj); diffuseColor.a *= clamp(0.5 + cg / max(fwidth(cg), 1e-6), 0.0, 1.0);\n';
    if (keep) code += 'float kg = keepG(vObj); diffuseColor.a *= clamp(0.5 - kg / max(fwidth(kg), 1e-6), 0.0, 1.0);\n';
    if (cut || keep) code += 'if (diffuseColor.a < 0.03) discard;\n';
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vObj;\n' + (cut ? sdfGLSL('cutG', cut) : '') + (keep ? sdfGLSL('keepG', keep) : ''))
      .replace('#include <map_fragment>', '#include <map_fragment>\n' + code + frag)
      .replace('#include <opaque_fragment>', '#include <opaque_fragment>\n' + (backDark ? 'if (!gl_FrontFacing) gl_FragColor.rgb = vec3(0.006);' : ''));
  };
  mat.customProgramCacheKey = () => id;
  return mat;
}

// ================================================================ colors / materials
const BLUE = '#2a2b9c', ORANGE = '#f4631a', GREY = '#77797d', WHITE = '#f5f5f5', BLACK = '#101012';
const FONT = '"Arial Black", "Helvetica Neue", Arial, sans-serif';

const paintProps = { metalness: 0.15, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.0 };
const bluePaint = new THREE.MeshPhysicalMaterial({ ...paintProps, color: BLUE });
const carbonTex = canvasTex(64, 64, (ctx) => {
  ctx.fillStyle = '#17171a'; ctx.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 4 < 2 ? '#26262a' : '#0d0d0f';
    ctx.fillRect(x * 8, y * 8, 8, 8);
  }
});
carbonTex.wrapS = carbonTex.wrapT = THREE.RepeatWrapping; carbonTex.repeat.set(14, 14);
const carbon = new THREE.MeshPhysicalMaterial({ map: carbonTex, roughness: 0.4, metalness: 0.3, clearcoat: 1, clearcoatRoughness: 0.08 });
const blackMatte = new THREE.MeshStandardMaterial({ color: 0x121214, roughness: 0.8, metalness: 0.1 });
const blackPlastic = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.55 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 1, roughness: 0.08 });
const darkVoid = new THREE.MeshBasicMaterial({ color: 0x050506, side: THREE.BackSide });

const car = new THREE.Group();
scene.add(car);

// ================================================================ body shape
const XT = 2.27, XR = -2.235, W0 = 0.875;
const FRONT_AXLE = 1.33, REAR_AXLE = -1.2, WHEEL_R = 0.33;
const ARCH_R = 0.392, ARCH_Y = 0.325;
const NOSE_X = 1.5, NOSE_N = 4.0, TAIL_X = -1.75, TAIL_N = 3.6;

function planW(x) {
  let w = W0 - 0.012 * Math.exp(-(((x + 0.1) / 0.6) ** 2)); // faint coke-bottle waist at the doors
  if (x > NOSE_X) { const t = (x - NOSE_X) / (XT - NOSE_X); w *= Math.pow(Math.max(0, 1 - t ** NOSE_N), 1 / NOSE_N); }
  if (x < TAIL_X) { const t = (TAIL_X - x) / (TAIL_X - XR); w *= Math.pow(Math.max(0, 1 - t ** TAIL_N), 1 / TAIL_N); }
  return w;
}
const bodyTop = profile([
  [2.27, 0.625], [2.262, 0.645], [2.24, 0.664], [2.2, 0.682], [2.1, 0.713], [1.8, 0.772], [1.3, 0.835], [0.95, 0.875],
  [0.2, 0.9], [-0.6, 0.915], [-1.4, 0.935], [-1.9, 0.957], [-2.12, 0.96], [-2.2, 0.935], [-2.235, 0.875],
]);
const bodyMid = profile([[2.27, 0.42], [1.8, 0.47], [1.0, 0.52], [0, 0.55], [-1.2, 0.6], [-2.235, 0.62]]);
const bodyBot = (x) => 0.175 + (x < -1.85 ? 0.2 * ((-1.85 - x) / 0.385) ** 2 : 0) + (x > 2.1 ? 0.03 * ((x - 2.1) / 0.17) ** 2 : 0);

const N1 = 24, N2 = 26, N3 = 46, CS = N1 + N2;   // lower | side-upper | top;  CS = side/top UV seam column
const TH_S = Math.acos(Math.pow(0.88, 3.25));    // seam where z = 0.88 w
function bodyRow(x) {
  const w = planW(x), yb = bodyBot(x), yE = bodyMid(x), yt = bodyTop(x);
  const Hl = yE - yb, Hu = yt - yE;
  const low = [], up1 = [], up2 = [];
  for (let k = 0; k <= 60; k++) {
    const th = (Math.PI / 2) * (1 - k / 60);
    const y = Hl * Math.pow(Math.sin(th), 2 / 5);
    low.push([k === 0 ? 0 : w * Math.pow(Math.cos(th), 2 / 6) * (1 - 0.05 * (y / Hl) ** 2), yE - y]);
  }
  const upper = (th) => [w * Math.pow(Math.max(0, Math.cos(th)), 2 / 6.5), yE + Hu * Math.pow(Math.sin(th), 2 / 4)];
  for (let k = 0; k <= 60; k++) up1.push(upper((TH_S * k) / 60));
  for (let k = 0; k <= 80; k++) up2.push(upper(TH_S + ((Math.PI / 2 - TH_S) * k) / 80));
  up2[80][0] = 0;
  const sec = [...resample(low, N1), ...resample(up1, N2).slice(1), ...resample(up2, N3).slice(1)];
  return sec.map(([z, y], j) => {
    if (j <= CS && w > 0.3) // wheel-arch flares
      for (const [cx, amp] of [[FRONT_AXLE, 0.02], [REAR_AXLE, 0.03]]) {
        const r = Math.hypot(x - cx, y - ARCH_Y);
        z += amp * Math.exp(-(((r - ARCH_R - 0.035) / 0.08) ** 2)) * smooth(0.55, 0.85, z / w);
      }
    let px = x;
    px -= smooth(1.6, XT, x) * 0.06 * ((y - 0.42) / 0.25) ** 2;   // nose profile

  const bytes = Uint8Array.from(atob(window.S15_GLB), (c) => c.charCodeAt(0));
  new GLTFLoader().parse(bytes.buffer, '', (gltf) => {
    const model = gltf.scene;
    model.rotation.y = Math.PI / 2;                         // model faces +z, the scene's car faces +x
    model.updateMatrixWorld(true);
    const raw = new THREE.Box3().setFromObject(model).getSize(V3());
    model.scale.setScalar(4.445 / Math.max(raw.x, raw.z));  // the file's units are off by 100x: size it to a real S15 (4.445 m long)
    model.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    model.position.set(-(box.min.x + box.max.x) / 2, DROP - box.min.y, -(box.min.z + box.max.z) / 2);   // centred, tyres on the floor
    for (const c of car.children) c.visible = false;        // hide the procedural car
    car.add(model);
    flame.visible = false;
    const seen = new Set();
    model.traverse((o) => {
      if (!o.isMesh) return;
      const m = o.material;
      o.castShadow = !m.transparent; o.receiveShadow = !m.transparent;
      if (seen.has(m)) return; seen.add(m);
      if (m.transmission > 0) { m.transmission = 0; m.transparent = true; m.opacity = /Window/.test(m.name) ? 0.42 : 0.7; m.depthWrite = false; m.roughness = 0.03; m.envMapIntensity = 1.6; }

      if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();

// ================================================================ engine: simulation + synthesized sound
const $ = (id) => document.getElementById(id);
const IDLE = 1100, REDLINE = 7200, MAXRPM = 8000;
const RATIOS = [3.32, 1.9, 1.31, 1.0, 0.84], FINAL = 4.1;
const eng = { on: false, rpm: 0, v: 0, gear: 1, neutral: true, throttle: 0, boost: 0, cut: 0, accel: 0, gas: false, brake: false };
window.__eng = eng;
let audio = null;

function buildAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0.7;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp).connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noiseSrc = () => { const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true; n.start(); return n; };

  // ---- engine: recorded loops of a real straight-six, pitched to the rpm and crossfaded
  // low<->high by revs and on<->off by throttle (see audio/engine-samples.js for the source)
  const engBus = ctx.createGain(); engBus.gain.value = 0;
  const engLp = ctx.createBiquadFilter(); engLp.type = 'lowpass'; engLp.frequency.value = 18000;
  engBus.connect(engLp).connect(master);
  const decode = (b64) => ctx.decodeAudioData(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer);
  let voices = {}, xfade = [2900, 6600], loadId = 0;
  function loadEngine(name) {
    const def = window.ENGINES?.[name];
    if (!def) return;
    const id = ++loadId;
    Promise.all(Object.entries(def.samples).map(([key, smp]) => decode(smp.data).then((buf) => [key, smp, buf]))).then((list) => {
      if (id !== loadId) return;
      for (const v of Object.values(voices)) { v.src.stop(); v.g.disconnect(); }
      voices = {};
      for (const [key, smp, buf] of list) {
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const g = ctx.createGain(); g.gain.value = 0;
        src.connect(g).connect(engBus); src.start();
        voices[key] = { src, g, rpm: smp.rpm, vol: smp.vol };
      }
      xfade = [def.samples.on_low.rpm * 0.9, def.samples.on_high.rpm * 0.9];
    }).catch((e) => console.error('engine samples', name, e));
  }
  let startBuf = null;
  if (window.ENGINE_START) decode(window.ENGINE_START).then((b) => (startBuf = b)).catch(() => {});
  // ---- turbo: big single. A low whistle that climbs as it spools, with air rushing behind it.
  const turbo = ctx.createOscillator(); turbo.type = 'sine';
  const turbo2 = ctx.createOscillator(); turbo2.type = 'sine';
  const turboGain = ctx.createGain(); turboGain.gain.value = 0;
  const t2g = ctx.createGain(); t2g.gain.value = 0.3;
  turbo.connect(turboGain); turbo2.connect(t2g).connect(turboGain); turboGain.connect(master);
  turbo.start(); turbo2.start();
  const tBp = ctx.createBiquadFilter(); tBp.type = 'bandpass'; tBp.Q.value = 2.2;
  const tNoise = ctx.createGain(); tNoise.gain.value = 0;
  noiseSrc().connect(tBp).connect(tNoise).connect(master);
  // blow-off valve + exhaust pops (one-shot envelopes on looping noise)
  const bovBp = ctx.createBiquadFilter(); bovBp.type = 'bandpass'; bovBp.Q.value = 1.5;
  const bovGain = ctx.createGain(); bovGain.gain.value = 0;
  noiseSrc().connect(bovBp).connect(bovGain).connect(master);
  // backfire bus: pops ring through a short "pipe" comb and a small room tail, so they sound like
  // they come out of an exhaust instead of being dry clicks
  const popBus = ctx.createGain(); popBus.gain.value = 0.9;
  const popTone = ctx.createBiquadFilter(); popTone.type = 'lowpass'; popTone.frequency.value = 2600;
  popBus.connect(popTone).connect(ctx.destination);
  const comb = ctx.createDelay(0.05); comb.delayTime.value = 0.0062;
  const combFb = ctx.createGain(); combFb.gain.value = 0.42;
  const combOut = ctx.createGain(); combOut.gain.value = 0.5;
  popTone.connect(comb); comb.connect(combFb).connect(comb); comb.connect(combOut).connect(ctx.destination);
  const ir = ctx.createBuffer(2, ctx.sampleRate * 0.45, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let y = 0; for (let i = 0; i < d.length; i++) { y += ((Math.random() * 2 - 1) - y) * 0.25; d[i] = y * Math.exp(-i / (ctx.sampleRate * 0.09)); } }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const verbGain = ctx.createGain(); verbGain.gain.value = 0.9;
  popTone.connect(verb).connect(verbGain).connect(ctx.destination);
  const set = (p, v, tc = 0.03) => p.setTargetAtTime(v, ctx.currentTime, tc);
  return {
    ctx,
    loadEngine,
    update(rpm, load, boost, cranking = false) {
      const live = rpm > 100 ? 1 : 0;
      const hi = smooth(xfade[0], xfade[1], rpm) * Math.PI / 2, on = clamp(load, 0, 1) * Math.PI / 2;
      const mix = { on_low: Math.cos(hi) * Math.sin(on), on_high: Math.sin(hi) * Math.sin(on), off_low: Math.cos(hi) * Math.cos(on), off_high: Math.sin(hi) * Math.cos(on) };
      for (const [key, v] of Object.entries(voices)) {
        set(v.src.playbackRate, Math.max(0.04, rpm / v.rpm), 0.02);
        set(v.g.gain, mix[key] * v.vol, 0.04);
      }
      set(engBus.gain, cranking ? 0 : live * (0.6 + 0.4 * load), cranking ? 0.02 : 0.12);   // silent while the recorded start-up plays the cranking
      const b = Math.pow(boost, 0.8);
      set(turbo.frequency, 650 + 3100 * b, 0.12); set(turbo2.frequency, (650 + 3100 * b) * 2.02, 0.12);
      set(turboGain.gain, 0.075 * Math.pow(boost, 1.4), 0.1);
      set(tBp.frequency, 1300 + 2600 * b, 0.12);
      set(tNoise.gain, 0.16 * boost, 0.1);
    },
    bov(strength) {   // big-turbo flutter: stu-tu-tu-tu, each chop quieter and lower
      const t = ctx.currentTime, n = 4 + Math.round(4 * strength);
      bovBp.frequency.cancelScheduledValues(t); bovBp.frequency.setValueAtTime(4200, t); bovBp.frequency.exponentialRampToValueAtTime(1500, t + 0.06 * n);
      bovGain.gain.cancelScheduledValues(t); bovGain.gain.setValueAtTime(0, t);
      for (let i = 0; i < n; i++) {
        const t0 = t + i * (0.048 + i * 0.004);
        bovGain.gain.linearRampToValueAtTime(0.75 * strength * Math.pow(0.82, i), t0 + 0.008);
        bovGain.gain.linearRampToValueAtTime(0.02, t0 + 0.04);
      }
      bovGain.gain.linearRampToValueAtTime(0, t + 0.06 * n + 0.15);
    },
    // one backfire: a short low-mid burst (the bang) plus a pitch-dropping thump (the pressure wave)
    pop(when = 0, level = 1) {
      const t = ctx.currentTime + when;
      const n = ctx.createBufferSource(); n.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 320 + Math.random() * 700 + 500 * level; bp.Q.value = 1.1;
      const g = ctx.createGain(), len = 0.025 + 0.05 * level * Math.random();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6 * level, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(bp).connect(g).connect(popBus); n.start(t, Math.random() * 1.5); n.stop(t + len + 0.02);
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.frequency.setValueAtTime(120 + 60 * level, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.07);
      og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.7 * level, t + 0.003); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(og).connect(popBus); o.start(t); o.stop(t + 0.1);
    },
    starter() {   // recorded start-up: starter motor, the engine catching, then it fades under the loops
      if (!startBuf) return false;
      const s = ctx.createBufferSource(); s.buffer = startBuf;
      const g = ctx.createGain(); g.gain.value = 1.5;
      s.connect(g).connect(master); s.start();
      return true;
    },
  };
}

const CRANK = 0.55;   // seconds of cranking before it fires
function startEngine() {
  if (eng.on) return;
  audio ??= buildAudio();
  audio.ctx.resume();
  if (!audio.loaded) { audio.loadEngine($('engSel').value); audio.loaded = true; }
  eng.starting = CRANK;
  setTimeout(() => audio.starter(), 60);   // first press: give the start-up sample a moment to decode
  eng.on = true; eng.rpm = 250; eng.neutral = true; eng.v = 0; eng.gear = 1;
  $('engBtn').textContent = '⏹ desligar';
  for (const id of ['gasBtn', 'brakeBtn', 'neutralBtn']) $(id).disabled = false;
  $('neutralBtn').classList.add('on');
}
function stopEngine() {
  eng.on = false; eng.gas = eng.brake = false;
  audio?.update(0, 0, 0); audio?.ctx.suspend();
  $('engBtn').textContent = '🔑 ligar motor';
  for (const id of ['gasBtn', 'brakeBtn', 'neutralBtn']) { $(id).disabled = true; $(id).classList.remove('on'); }
}
function toggleNeutral() {
  if (!eng.on) return;
  eng.neutral = !eng.neutral;
  if (!eng.neutral) { eng.gear = 1; while (eng.gear < 5 && rpmAt(eng.v, eng.gear) > 6500) eng.gear++; }
  $('neutralBtn').classList.toggle('on', eng.neutral);
}
const rpmAt = (v, gear) => (v / (2 * Math.PI * WHEEL_R)) * 60 * RATIOS[gear - 1] * FINAL;
const torque = (rpm) => 0.55 + 0.45 * Math.sin(Math.PI * clamp((rpm - 1200) / 7600, 0, 1));

// exhaust flame: shot out of the tailpipe on every backfire
const flame = new THREE.Group();
{
  const mk = (pts, color, opacity) => {
    const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 20),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
    m.rotation.z = Math.PI / 2;   // +y of the profile -> out the back of the car
    return m;
  };
  flame.add(mk([[0.001, 0], [0.04, 0.03], [0.062, 0.12], [0.05, 0.24], [0.022, 0.36], [0.001, 0.46]], 0xff5a10, 0.75));
  flame.add(mk([[0.001, 0], [0.028, 0.03], [0.038, 0.1], [0.022, 0.2], [0.001, 0.28]], 0xffd070, 0.9));
  flame.add(mk([[0.001, 0], [0.018, 0.02], [0.02, 0.07], [0.001, 0.13]], 0xbfd8ff, 1));
  const glowTex = canvasTex(128, 128, (c) => { const g = c.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,190,90,1)'); g.addColorStop(0.4, 'rgba(255,110,20,0.45)'); g.addColorStop(1, 'rgba(255,80,0,0)'); c.fillStyle = g; c.fillRect(0, 0, 128, 128); });
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false }));
  glow.scale.setScalar(0.55); glow.position.x = -0.12;
  flame.add(glow);
  flame.position.copy(FLAME_POS);
  flame.visible = false; flame.userData.t = 0;
  flame.traverse((o) => (o.renderOrder = 8));
  car.add(flame);
}
function backfire(level = 1, when = 0) {
  audio.pop(when, level);
  if (level < 0.4) return;   // only the real bangs spit fire
  setTimeout(() => {
    flame.userData.t = 1; flame.userData.len = 0.5 + 0.9 * level * (0.6 + 0.4 * Math.random());
    flame.rotation.x = Math.random() * 6.28;
  }, when * 1000);
}
function stepFlame(dt) {
  const u = flame.userData;
  u.t = Math.max(0, u.t - dt / 0.1);
  flame.visible = u.t > 0;
  if (flame.visible) { const w = 0.55 + 0.6 * u.t; flame.scale.set(u.len * (0.5 + 0.5 * u.t), w, w); }
}

function stepEngine(dt) {
  if (!eng.on) { eng.rpm = Math.max(0, eng.rpm - 2500 * dt); eng.v = Math.max(0, eng.v - 6 * dt); eng.accel = 0; return; }
  if (eng.starting > 0) {   // cranking: turning over slowly, then it catches and flares
    eng.starting -= dt; eng.rpm = 210 + 90 * (1 - eng.starting / CRANK) + 25 * Math.sin(eng.starting * 55);
    audio.update(eng.rpm, 1, 0, true);
    if (eng.starting <= 0) { eng.rpm = 900; eng.flare = 0.45; }
    return;
  }
  eng.flare = Math.max(0, (eng.flare ?? 0) - dt);
  eng.cut = Math.max(0, eng.cut - dt);
  const want = eng.gas && eng.cut <= 0 ? 1 : 0;
  const prevThr = eng.throttle;
  eng.throttle += (want - eng.throttle) * Math.min(1, dt * 14);
  const v0 = eng.v;
  if (eng.neutral) {
    const target = Math.max(IDLE + eng.throttle * (MAXRPM - IDLE), eng.flare > 0 ? 2300 : 0);
    eng.rpm += (target - eng.rpm) * dt * (eng.throttle > 0.5 || eng.flare > 0 ? 7.5 : 3.2);
    eng.v = Math.max(0, eng.v - (0.3 + 0.0005 * eng.v * eng.v + (eng.brake ? 9 : 0)) * dt);
  } else {
    let a = eng.throttle * torque(eng.rpm) * (0.4 + 1.0 * eng.boost) * RATIOS[eng.gear - 1] * 3.9;   // off boost it is lazy, on boost it hits hard
    a = Math.min(a, 10.5);                                                // traction limit
    a -= 0.00055 * eng.v * eng.v + 0.15;
    if (eng.throttle < 0.1) a -= 0.25 * RATIOS[eng.gear - 1];          // engine braking
    if (eng.brake) a -= 9;
    eng.v = Math.max(0, eng.v + a * dt);
    const locked = rpmAt(eng.v, eng.gear);
    const slip = IDLE + eng.throttle * 2600;                           // clutch slipping off the line
    eng.rpm += (Math.max(locked, slip) - eng.rpm) * Math.min(1, dt * 18);
    if (eng.rpm > 6900 && eng.gear < 5 && eng.throttle > 0.5) { eng.gear++; eng.cut = 0.12; backfire(1); if (Math.random() < 0.6) backfire(0.7, 0.07); }
    else if (eng.gear > 1 && eng.rpm < 2400 && rpmAt(eng.v, eng.gear - 1) < 5600) eng.gear--;
  }
  if (eng.rpm > REDLINE && eng.cut <= 0) { eng.cut = 0.07; backfire(0.8); }   // rev limiter
  // turbo spool, blow-off on lift, pops on overrun
  const spool = eng.throttle * smooth(2800, 4400, eng.rpm);
  eng.boost += (spool - eng.boost) * dt * (spool > eng.boost ? 2.0 : 6);
  if (prevThr > 0.5 && eng.throttle <= 0.5 && eng.boost > 0.35 && (!eng.gas || eng.cut > 0.08)) { audio.bov(eng.boost); eng.boost *= 0.2; }
  // overrun: a dense crackle right after lifting, thinning out as the revs fall
  if (prevThr > 0.5 && eng.throttle <= 0.5 && !eng.gas) eng.overrun = eng.rpm > 3000 ? 1 : 0;
  if (eng.gas) eng.overrun = 0;
  if (eng.overrun > 0 && eng.rpm > 1800) {
    eng.overrun = Math.max(0, eng.overrun - dt / 2.6);
    eng.popWait = (eng.popWait ?? 0.05) - dt;
    if (eng.popWait <= 0) {
      // irregular gurgle: a cluster of mostly small pops with the odd loud bang, never evenly spaced
      const n = 1 + Math.floor(Math.random() ** 2 * 6);
      let when = 0, lvl = Math.random() < 0.14 ? 1 : 0.2 + 0.45 * Math.random() ** 2;
      for (let i = 0; i < n; i++) {
        backfire(lvl * (0.6 + 0.4 * eng.overrun), when);
        when += 0.028 + Math.random() * 0.06;
        lvl *= 0.55 + 0.4 * Math.random();
      }
      eng.popWait = when + 0.06 + Math.random() * (0.55 - 0.4 * eng.overrun);
    }
  }
  eng.accel += ((eng.v - v0) / Math.max(dt, 1e-4) - eng.accel) * Math.min(1, dt * 6);
  audio.update(eng.rpm, eng.throttle, eng.boost);
}

if (Q.has('rev')) {   // self-test: steps the simulation with a fixed timestep and logs what happened

  const b0 = audio.bov, p0 = audio.pop;
  audio.bov = (x) => { bov++; b0(x); }; audio.pop = (...a) => { pops++; p0(...a); };
  const run = (sec, gas, brake = false) => { eng.gas = gas; eng.brake = brake; for (let t = 0; t < sec; t += 1 / 60) { stepEngine(1 / 60); maxKmh = Math.max(maxKmh, eng.v * 3.6); } };
  const snap = (tag) => log.push(`${tag}: ${eng.neutral ? 'N' : 'g' + eng.gear} ${Math.round(eng.rpm)}rpm ${Math.round(eng.v * 3.6)}kmh boost ${eng.boost.toFixed(2)}`);
  run(1.5, false); snap('idle');
  run(2.5, true); snap('rev N');
  run(2, false); snap('lift');
  toggleNeutral();
  for (const t of [2, 3, 5, 10, 20]) { run(t, true); snap('gas +' + t + 's'); }
  run(3, false); snap('coast');
  run(8, false, true); snap('brake');
  console.log(`ENGTEST ctx=${audio.ctx.state} bov=${bov} pops=${pops} max=${Math.round(maxKmh)}kmh | ` + log.join(' | '));
  stopEngine();
}
</script>
